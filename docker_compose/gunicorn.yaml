version: "3.9"

services:
  gunicorn:
    build:
      context: ..
      dockerfile: Dockerfile.prod
    container_name: main-app
    command: "gunicorn -c /app/gunicorn.conf.py core.project.wsgi:application"
    env_file:
      - ../.env
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - hrresumebank-network
