version: "3.9"
services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"  # Готовим для SSL
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ../nginx/ssl:/etc/nginx/ssl  # Для SSL сертификатов
    networks:
      - hrresumebank-network
