services:
  postgres:
    extends:
      file: storages_prod.yaml
      service: postgres

  gunicorn:
    extends:
      file: gunicorn.yaml
      service: gunicorn
    depends_on:
      - postgres

  nginx:
    extends:
      file: nginx.yaml
      service: nginx
    depends_on:
      - gunicorn

networks:
  hrresumebank-network:

volumes:
  media_volume:
    external: true
    name: hrresumebank_media
  static_volume:
  postgres_data:
    external: true
    name: hrresumebank_postgres