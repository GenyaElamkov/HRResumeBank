{% extends "base.html" %}

{% block title %}Все резюме - Система резюме{% endblock %}

{% block content %}

<!-- Заголовок и панель поиска -->
    <div class="row mb-4">
        <div class="col-md-8">
            <h1 class="h3 mb-0">База резюме службы безопасности</h1>
            <p class="text-muted">Управление кандидатами и сотрудниками</p>
        </div>
    </div>

    <!-- Панель поиска и фильтров -->
    <div class="search-panel">
        <div class="row">
            <div class="col-md-10 mb-3 mb-md-0">
                <input type="text" class="search-input" placeholder="Поиск по ФИО, должности или навыкам...">
            </div>
            <div class="col-md-2">
                <button class="filter-btn w-100">
                    <i class="bi bi-funnel me-2"></i>Поиск
                </button>
            </div>
        </div>
    </div>

    <!-- Сетка с карточками резюме -->

    <div id="card-list">
        {% include "resumes/partials/card_list_content.html" %}
    </div>


<!-- HTMX конфигурация -->
<script>
    document.body.addEventListener('htmx:beforeRequest', function(e) {
        e.detail.target.classList.add('loading');
    });

    document.body.addEventListener('htmx:afterRequest', function(e) {
        e.detail.target.classList.remove('loading');
    });

    // Функция для поиска резюме
    function searchResumes() {
        const searchTerm = document.getElementById('searchInput').value;
        htmx.ajax('GET', `/?search=${encodeURIComponent(searchTerm)}`, {
            target: '#card-list',
            swap: 'innerHTML'
        });
    }
</script>
{% endblock %}
