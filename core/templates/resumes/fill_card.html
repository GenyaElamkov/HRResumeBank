{% extends "base.html" %}
{% block content %}
<h2>Заполнить карточку: {{ card.template.title }}</h2>
<form method="post">
    {% csrf_token %}
    <table>
        {% for field in form %}
        <tr>
            <td>{{ field.label_tag }}</td>
            <td>{{ field }}{% if field.errors %}<div style="color:red">{{ field.errors }}</div>{% endif %}</td>
        </tr>
        {% endfor %}
    </table>
    <button type="submit">Сохранить</button>
</form>
<a href="{% url 'resumes:card_detail' card.id %}">Назад к карточке</a>
{% endblock %}
