{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HR Resume">
    <meta property="og:locale" content="ru_RU">
    <meta property="og:type" content="article">
    <meta property="og:title" content="HR Resume">
    <meta property="og:description" content="HR Resume">
    <meta property="og:url" content="http://10.92.40.100/">
    <meta property="og:site_name" content="HR Resume">
    <meta property="article:section" content="Контент">
    <meta property="og:image" content="http://10.92.40.100/static/images/image.png">
    <meta property="og:image:secure_url" content="http://10.92.40.100/static/images/image.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:description" content="HR Resume">
    <meta name="twitter:title" content="HR Resume">
    <meta name="twitter:image" content="http://10.92.40.100/static/images/image.png">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'images/logo16x16.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/logo32x32.png' %}">
    <title>{{ title }}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>
    <link rel="stylesheet" href="{% static '/css/error_page.css' %}?v=1.0">

</head>
<body>
    <div class="error-page">
        <div class="error-card">
            <div class="error-icon">
                <i class="bi bi-exclamation-triangle-fill"></i>
            </div>

            <div class="error-status">{{ status }}</div>

            <h2 class="error-top-message">{{ error_top_message }}</h2>

            <p class="error-message">{{ error_message }}</p>

            <a href="{% url 'resumes:card_list' %}" class="btn btn-primary btn-home">
                <i class="bi bi-house-door me-2"></i>Вернуться на главную
            </a>

            <div class="mt-4">
                <small class="text-muted">
                    Если проблема сохраняется, обратитесь в поддержку
                </small>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
