{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="bi bi-check-circle-fill me-2"></i>Выход выполнен</h4>
            </div>
            <div class="card-body text-center">
                <div class="mb-4">
                    <i class="bi bi-shield-check" style="font-size: 3rem; color: var(--success);"></i>
                </div>
                <h5>Вы успешно вышли из системы</h5>
                <p class="text-muted">Для вашей безопасности сессия была завершена.</p>

                <div class="d-grid gap-2 mt-4">
                    <a href="{% url 'authentication:login' %}" class="btn btn-primary">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Войти снова
                    </a>
                    <a href="/" class="btn btn-outline-secondary">
                        <i class="bi bi-house me-2"></i>На главную
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
