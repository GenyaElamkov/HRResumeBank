worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ----------------------------------------
    #  Базовые настройки
    # ----------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    server_tokens off;

    # ----------------------------------------
    #  Логирование
    # ----------------------------------------
    access_log /var/log/nginx/access_main.log;
    error_log /var/log/nginx/error_main.log warn;

    # ----------------------------------------
    #  Gzip сжатие
    # ----------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;

    # ----------------------------------------
    #  Upstream для Gunicorn
    # ----------------------------------------
    upstream gunicorn {
        server gunicorn:8000;
        keepalive 32;
    }

    # ----------------------------------------
    #  Основной сервер (HTTP)
    # ----------------------------------------
    server {
        listen 80;
        server_name $MY_SERVER_IP;
        return 301 https://$server_name$request_uri;

        # --- Security headers ---
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Исправленный заголовок CSP
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https: blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none';" always;

        # ----------------------------------------
        #  Статические файлы
        # ----------------------------------------
        location /static/ {
            alias /app/staticfiles/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
            access_log /var/log/nginx/access_static.log;
        }

        # ----------------------------------------
        #  Медиа файлы
        # ----------------------------------------
        location /media/ {
            alias /app/media/;
            expires 30d;
            add_header Cache-Control "public";
            access_log /var/log/nginx/access_media.log;
        }

        # ----------------------------------------
        #  Django приложение
        # ----------------------------------------
        location / {
            proxy_pass http://gunicorn;

            # Основные заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;

            # HTTP 1.1 и keep-alive
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Таймауты
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Буферизация
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 32 16k;
            proxy_busy_buffers_size 64k;
            proxy_temp_file_write_size 64k;

            # Ограничение запросов (anti-flood)
            limit_req zone=api_limit burst=20 nodelay;
        }

        # ----------------------------------------
        #  Health check
        # ----------------------------------------
        location /health/ {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # ----------------------------------------
    #  Ограничение запросов
    # ----------------------------------------
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # ----------------------------------------
    #  Заготовка под HTTPS (на будущее)
    # ----------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name $MY_SERVER_IP;

        ssl_certificate /etc/nginx/ssl/proavia_full.pem;
        ssl_certificate_key /etc/nginx/ssl/proavia.key;
        # include snippets/ssl-params.conf;
        
        # ----------------------------------------
        #  Django приложение
        # ----------------------------------------
        location / {
            proxy_pass http://gunicorn;

            # Основные заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;

            # HTTP 1.1 и keep-alive
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Таймауты
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Буферизация
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 32 16k;
            proxy_busy_buffers_size 64k;
            proxy_temp_file_write_size 64k;

            # Ограничение запросов (anti-flood)
            limit_req zone=api_limit burst=20 nodelay;
        }
        # ----------------------------------------
        #  Статические файлы
        # ----------------------------------------
        location /static/ {
            alias /app/staticfiles/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
            access_log /var/log/nginx/access_static.log;
        }

        # ----------------------------------------
        #  Медиа файлы
        # ----------------------------------------
        location /media/ {
            alias /app/media/;
            expires 30d;
            add_header Cache-Control "public";
            access_log /var/log/nginx/access_media.log;
        }
        # ----------------------------------------
        #  Health check
        # ----------------------------------------
        location /health/ {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
