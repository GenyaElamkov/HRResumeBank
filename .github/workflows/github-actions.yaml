name: Django CI

on:
  push:
    branches:
      - dev
    
  pull_request:
    branches:
      - dev
      - master

env:
  DJANGO_SETTINGS_MODULE: core.project.settings.test
  DJANGO_SECRET_KEY: test-key-123-for-ci-only

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Fix PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov coverage

      - name: Run tests
        run: |
          pytest --disable-warnings --maxfail=1 --cov=. --cov-report=xml

      - name: Run tests with coverage
        run: |
          pip install coverage pytest-cov
          pytest --cov=. tests/
          coverage xml -o coverage.xml
          coverage report

      - name: Fail PR if tests failed
        if: failure()
        run: |
          echo "Tests failed! Please fix before merging."
          exit 1